{% extends "base.html" %}
{% block content %}
<div class="container-fluid mt-4">
  <h2>Dashboard Agent Financier</h2>
  <div class="row mt-3">
    <div class="col-md-6">
      <div class="card text-white bg-primary mb-3">
        <div class="card-body">
          <h5 class="card-title"><i class="bi bi-currency-dollar"></i> Recettes</h5>
          <p class="card-text">Enregistrer et suivre toutes les recettes.</p>
          <a href="#" class="btn btn-light btn-sm">Voir</a>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card text-white bg-success mb-3">
        <div class="card-body">
          <h5 class="card-title"><i class="bi bi-receipt"></i> Dépenses</h5>
          <p class="card-text">Gérer et suivre les dépenses internes de la mairie.</p>
          <a href="#" class="btn btn-light btn-sm">Gérer</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
