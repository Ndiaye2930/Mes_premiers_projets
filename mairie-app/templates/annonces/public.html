{%extends "base.html" %}
{% load static %}
{% block content %}

<body class="bg-light">
<div class="container py-5">
    <title>{{ annonce.titre }}</title>

    <h2 class="fw-bold">{{ annonce.titre }}</h2>
    <p class="text-muted">Publié le {{ annonce.created_at|date:"d/m/Y H:i" }}</p>

    <div class="mt-4">
        <p style="white-space: pre-wrap; font-size: 1.1rem;">
            {{ annonce.contenu }}
        </p>
    </div>

    {% if annonce.fichier_pdf %}
        <hr>
        <h5>📄 Document PDF</h5>
        <a class="btn btn-primary" href="{{ annonce.fichier_pdf.url }}" download>Télécharger</a>

        <iframe src="{{ annonce.fichier_pdf.url }}" class="mt-3" style="width:100%; height:600px;"></iframe>
    {% endif %}

</div>
 
{% endblock %}
