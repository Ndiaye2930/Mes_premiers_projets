<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: DejaVu Sans, sans-serif; font-size:12px; }
.header{ text-align:center; margin-bottom:10px; }
table{ width:100%; border-collapse: collapse; }
th, td{ border:1px solid #000; padding:6px; }
.qr{ position:fixed; right:20px; bottom:20px; text-align:center; }
</style>
</head>
<body>
  <div class="header">
    <h2>RÉPUBLIQUE DU SÉNÉGAL</h2>
    <h3>{{ cert.get_type_certificat_display }}</h3>
  </div>

  <table>
    <tr><th>Nom</th><td>{{ cert.nom }}</td></tr>
    <tr><th>Prénom</th><td>{{ cert.prenom }}</td></tr>
    <tr><th>Date de naissance</th><td>{{ cert.date_naissance }}</td></tr>
    <tr><th>Adresse</th><td>{{ cert.adresse }}</td></tr>
    <tr><th>Motif</th><td>{{ cert.motif|linebreaksbr }}</td></tr>
    <tr><th>Statut</th><td>{{ cert.statut }}</td></tr>
  </table>
  

  <div class="qr">
    <img src="data:image/png;base64,{{ qr_b64 }}" width="100"/>
    <div style="font-size:10px;">Scanner pour vérifier</div>
  </div>
</body>
</html>
