<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid #000; padding: 6px; }
th { background: #ddd; }
</style>
</head>
<body>

<h2>Liste des utilisateurs</h2>

<table>
<thead>
<tr>
    <th>Nom</th>
    <th>Prénom</th>
    <th>Email</th>
    <th>Téléphone</th>
    <th>Rôle</th>
</tr>
</thead>
<tbody>
{% for u in users %}
<tr>
    <td>{{ u.nom }}</td>
    <td>{{ u.prenom }}</td>
    <td>{{ u.email }}</td>
    <td>{{ u.telephone }}</td>
    <td>{{ u.get_role_display }}</td>
</tr>
{% endfor %}
</tbody>
</table>

</body>
</html>
