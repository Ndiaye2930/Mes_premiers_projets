<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calcul avec les formulaires</title>
</head>
<body>
    <form action="" oninput="x.value = parseInt(a.value) + parseInt(b.value )">
          <input type="text" name="a" id="a" placeholder="0"> 
        +
        <input type="number" name="b" id="b" min="0" max="100" placeholder="0">
        = <output name="x" for="a b"></output>
         
    </form>
</body>
</html>
