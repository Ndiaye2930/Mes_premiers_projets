<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>un tableau</title>
</head>
<body>
    <table border="1">
      <thead>
         <tr>
           <th colspan="2">Catégorie</th>
           <th>Nuité</th>
           <th>Repas du soir/petit déjauner</th>
           <th>1/2 pension</th>
         </tr>
         </thead>
         <thead>
          <tbody>
         <tr>
           <th colspan="2">Plein tarif</th>
           <td>30 Dt</td>
          <td rowspan="3">50 Dt</td>
           <td>70 Dt</td>
         </tr> 
           <th>STD-de 8 personnes</th>
           <th>STD-de 24ans</th>
           <td>26 Dt</td> 
           <td>66 dt</td>
         </tr>
         <tr>
          <th colspan="2">CAF-guide</th>
          <td>15 Dt</td>
          <td>54 Dt</td>
         </tr>
          </tbody>
          </thead>
    </table>
    
</body>
</html>
