<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Eléments graphiques  avec SVG </title>
</head>
<body>  
    <h1>Dessiner avec l'élément SVG en HTML5</h1> 
   <svg width="400" height="200" style="border: 1px gris uni;"> 
        <rect x="0" y="0" width="100" height="100" 
            style="fill:rgb(0,0,255); Stroke-width: 1; Stroke: rgb ( 0,0,0);" /> 
        <circle cx="200" cy="100" r="40" Stroke="red" Stroke-width="2" fill="pink" /> 
       <polygon points="100,10 40,198 190,78 10,78 160 198" 
            style="fill:lime;AVC:violet;AVC-width:5;fill-rule:evenodd;" />
    </svg> 
    <svg width="300" height="100" style="border: 1px solid gray;"> 
        <rect x="0" y="0" width="100" height="100 " 
         style="remplissage:vert;" /> 
         <rect x="100" y="0" width="100" height="100" style="fill:jaune;" /> 
         <rect x="200" y="0" width="100" height="100" style="fill:red;" /> 
         <polygon points="150,0, 100, 50" 
            style="fill:lime; Stroke:red;Stroke-width:1;fill-rule:evenodd;" /> 
    </svg> 
    <svg width="300" height="100" style="border: 1px solid gray;">
        <rect x="0" y="0" width="100" height="100"
        style="fill: green"/>
        <rect x="100" y="0" width="100" height="100"
        style="fill:yellow"/>
        <rect x="200" y="0" width="100" height="100"
        style="fill: red"/>
        <polygon points="100.50 120.150. 30.70 170.70 80.150" style="fill:green"></polygon>
         
    </svg>
</body>
</html>
