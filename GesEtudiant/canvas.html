<!DOCTYPE html>
<html lang="fr">                         
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les éléments graphiques</title>
    <style>
        #ndiaye{
        width: 500px;
        height: 200px; 
        border: 1px solid gray;
        border-radius: 10px;
        box-shadow : 5px 5px 5px black;
    }
        </style>
</head>
<body>
    <h1>Les éléments Canvas</h1>
    <canvas id="ndiaye"></canvas>
    <script>
      var c = document.getElementById("ndiaye");//permet de le Canvas par son id.
        var ctx = c.getContext("2d");// appelle sa méthode getContext() en lui passant la chaine("2d").
      //  ctx.fillStyle ="gray";// peut etre unu couleur CSS, un gardient ou un motif.
       // ctx.fillRect(10, 20, 50, 50);//(x, y, w, height) dessine un rectangle rempli avec le style de remplissage.
        //On va tracer une ligne
      //  ctx.fillStyle ="gray";
      //  ctx.moveTo(0,0);
       // ctx.lineTo(500,200);
       // ctx.stroke();//

        ctx.fillStyle ="gray";
        ctx.beginPath();
        ctx.arc(95,50,40, 0,2*Math.PI);
        ctx.stroke();
    </script>
</body>
</html>
